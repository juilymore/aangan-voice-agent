ah)"/><polyline points="970,521 970,647" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1041,692 1388,692 1388,755" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="369,800 391,800" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="532,755 532,640 716,640 716,521" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="167" y="107" width="202" height="90" rx="10" fill="#e3e5ff" stroke="#4a4fd4" stroke-width="1.8"/><text x="268" y="148.75" text-anchor="middle" font-size="12.2" fill="#14284b">Calls the studio number (any</text><text x="268" y="163.25" text-anchor="middle" font-size="12.2" fill="#14284b">hour, day or night)</text><rect x="391" y="107" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="141.5" text-anchor="middle" font-size="12.2" fill="#14284b">Tells the agent about the</text><text x="492" y="156" text-anchor="middle" font-size="12.2" fill="#14284b">project: area, size, scope,</text><text x="492" y="170.5" text-anchor="middle" font-size="12.2" fill="#14284b">timeline</text><rect x="1287" y="107" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="148.75" text-anchor="middle" font-size="12.2" fill="#14284b">Gets a consultation booked, or a</text><text x="1388" y="163.25" text-anchor="middle" font-size="12.2" fill="#14284b">polite no</text><rect x="615" y="215" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="256.75" text-anchor="middle" font-size="12.2" fill="#14284b">Studio services, rules and the 9</text><text x="716" y="271.25" text-anchor="middle" font-size="12.2" fill="#14284b">standard questions (no prices)</text><rect x="839" y="215" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="249.5" text-anchor="middle" font-size="12.2" fill="#14284b">Asks questions one at a time and</text><text x="940" y="264" text-anchor="middle" font-size="12.2" fill="#14284b">spots the call type: lead,</text><text x="940" y="278.5" text-anchor="middle" font-size="12.2" fill="#14284b">update, complaint or other</text><rect x="1063" y="215" width="202" height="90" rx="10" fill="#ffdcec" stroke="#df3487" stroke-width="1.8"/><text x="1164" y="256.75" text-anchor="middle" font-size="12.2" fill="#14284b">Voice AI holds the conversation</text><text x="1164" y="271.25" text-anchor="middle" font-size="12.2" fill="#14284b">and calls the live tools</text><rect x="391" y="323" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="372" text-anchor="middle" font-size="12.2" fill="#14284b">Details collected so far</text><rect x="615" y="323" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">Lead rubric: 5 criteria, service</text><text x="716" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">area, budget check, calendar</text><rect x="839" y="323" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">Checks fit, finds open slots,</text><text x="940" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">books with no double booking</text><rect x="1287" y="323" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">Fit answer and booked slot go</text><text x="1388" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">back to the agent</text><rect x="391" y="431" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="472.75" text-anchor="middle" font-size="12.2" fill="#14284b">Call ends: transcript sent to the</text><text x="492" y="487.25" text-anchor="middle" font-size="12.2" fill="#14284b">system</text><rect x="615" y="431" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="472.75" text-anchor="middle" font-size="12.2" fill="#14284b">Rubric, office hours, designers,</text><text x="716" y="487.25" text-anchor="middle" font-size="12.2" fill="#14284b">past corrections</text><rect x="839" y="431" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="458.25" text-anchor="middle" font-size="12.2" fill="#14284b">Hides personal numbers, scores</text><text x="940" y="472.75" text-anchor="middle" font-size="12.2" fill="#14284b">the lead, flags price mentions,</text><text x="940" y="487.25" text-anchor="middle" font-size="12.2" fill="#14284b">assigns a designer, writes the</text><text x="940" y="501.75" text-anchor="middle" font-size="12.2" fill="#14284b">brief</text><rect x="1287" y="431" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="472.75" text-anchor="middle" font-size="12.2" fill="#14284b">Verdict, hot / warm / cold, brief</text><text x="1388" y="487.25" text-anchor="middle" font-size="12.2" fill="#14284b">and flags saved</text><rect x="1063" y="539" width="202" height="90" rx="10" fill="#ffdcec" stroke="#df3487" stroke-width="1.8"/><text x="1164" y="573.5" text-anchor="middle" font-size="12.2" fill="#14284b">Reads the transcript and pulls</text><text x="1164" y="588" text-anchor="middle" font-size="12.2" fill="#14284b">out facts with the exact quote.</text><text x="1164" y="602.5" text-anchor="middle" font-size="12.2" fill="#14284b">Does not decide</text><rect x="839" y="647" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="681.5" text-anchor="middle" font-size="12.2" fill="#14284b">Sends designer email, creates</text><text x="940" y="696" text-anchor="middle" font-size="12.2" fill="#14284b">HubSpot deal, adds calendar</text><text x="940" y="710.5" text-anchor="middle" font-size="12.2" fill="#14284b">event, alerts on complaints</text><rect x="167" y="755" width="202" height="90" rx="10" fill="#e3e5ff" stroke="#4a4fd4" stroke-width="1.8"/><text x="268" y="804" text-anchor="middle" font-size="12.2" fill="#14284b">Opens the email or the dashboard</text><rect x="391" y="755" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="796.75" text-anchor="middle" font-size="12.2" fill="#14284b">Corrects a verdict or fact, edits</text><text x="492" y="811.25" text-anchor="middle" font-size="12.2" fill="#14284b">the rubric</text><rect x="1287" y="755" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="796.75" text-anchor="middle" font-size="12.2" fill="#14284b">Dashboard with calls, briefs,</text><text x="1388" y="811.25" text-anchor="middle" font-size="12.2" fill="#14284b">metrics and revenue estimate</text></svg>
