ze="12" fill="#c9d3e6">the call)</text><rect x="12" y="422" width="1476" height="108" fill="#fdeee2"/><rect x="12" y="422" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">System</text><text x="84" y="490" text-anchor="middle" font-size="12" fill="#c9d3e6">(App Backend, after</text><text x="84" y="504" text-anchor="middle" font-size="12" fill="#c9d3e6">the call)</text><rect x="12" y="530" width="1476" height="108" fill="#e8f7ee"/><rect x="12" y="530" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="580" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">AI Models</text><text x="84" y="598" text-anchor="middle" font-size="12" fill="#c9d3e6">(LLM)</text><rect x="12" y="638" width="1476" height="108" fill="#e4f3f8"/><rect x="12" y="638" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="688" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Integrations</text><text x="84" y="706" text-anchor="middle" font-size="12" fill="#c9d3e6">(Resend, HubSpot,</text><text x="84" y="720" text-anchor="middle" font-size="12" fill="#c9d3e6">Calendar)</text><rect x="12" y="746" width="1476" height="108" fill="#fde9ef"/><rect x="12" y="746" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="796" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Studio Team</text><text x="84" y="814" text-anchor="middle" font-size="12" fill="#c9d3e6">(Nikhil, Ruhi, Jay)</text><line x1="380" y1="98" x2="380" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="604" y1="98" x2="604" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="828" y1="98" x2="828" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="1052" y1="98" x2="1052" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><