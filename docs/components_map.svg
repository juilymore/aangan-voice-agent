<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 906" width="1500" height="906" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#14284b"/></marker></defs>
<rect width="1500" height="906" fill="#ffffff"/>
<text x="750" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#14284b">Case 3 · Aangan Phone Agent — Components Map</text><rect x="12" y="58" width="1476" height="40" rx="6" fill="#14284b"/><text x="84" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Actor</text><text x="268" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Trigger</text><text x="492" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Input</text><text x="716" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Context</text><text x="940" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Processing</text><text x="1164" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">AI</text><text x="1388" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Output</text><rect x="12" y="98" width="1476" height="108" fill="#e9efff"/><rect x="12" y="98" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Caller</text><text x="84" y="166" text-anchor="middle" font-size="12" fill="#c9d3e6">(User)</text><rect x="12" y="206" width="1476" height="108" fill="#f1e9ff"/><rect x="12" y="206" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Voice Agent</text><text x="84" y="274" text-anchor="middle" font-size="12" fill="#c9d3e6">(Vaani · GPT-4o)</text><rect x="12" y="314" width="1476" height="108" fill="#fff6dd"/><rect x="12" y="314" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">System</text><text x="84" y="382" text-anchor="middle" font-size="12" fill="#c9d3e6">(live tools, during</text><text x="84" y="396" text-anchor="middle" font-size="12" fill="#c9d3e6">the call)</text><rect x="12" y="422" width="1476" height="108" fill="#fdeee2"/><rect x="12" y="422" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">System</text><text x="84" y="490" text-anchor="middle" font-size="12" fill="#c9d3e6">(pipeline, after the</text><text x="84" y="504" text-anchor="middle" font-size="12" fill="#c9d3e6">call)</text><rect x="12" y="530" width="1476" height="108" fill="#e8f7ee"/><rect x="12" y="530" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="580" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">AI Model</text><text x="84" y="598" text-anchor="middle" font-size="12" fill="#c9d3e6">(Gemini Flash)</text><rect x="12" y="638" width="1476" height="108" fill="#e4f3f8"/><rect x="12" y="638" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="688" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Integrations</text><text x="84" y="706" text-anchor="middle" font-size="12" fill="#c9d3e6">(Resend · HubSpot ·</text><text x="84" y="720" text-anchor="middle" font-size="12" fill="#c9d3e6">Calendar)</text><rect x="12" y="746" width="1476" height="108" fill="#fde9ef"/><rect x="12" y="746" width="144" height="108" fill="#14284b" stroke="#fff" stroke-width="1"/><text x="84" y="796" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Studio Team</text><text x="84" y="814" text-anchor="middle" font-size="12" fill="#c9d3e6">(Nikhil · Ruhi ·</text><text x="84" y="828" text-anchor="middle" font-size="12" fill="#c9d3e6">Jay)</text><line x1="380" y1="98" x2="380" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="604" y1="98" x2="604" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="828" y1="98" x2="828" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="1052" y1="98" x2="1052" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><line x1="1276" y1="98" x2="1276" y2="854" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/><polyline points="369,152 391,152" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="492,197 492,209 910,209 910,215" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1041,260 1063,260" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1102,305 1102,317 492,317 492,323" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="593,368 615,368" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="817,368 839,368" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1041,368 1287,368" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1368,323 1368,326 1164,326 1164,305" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1265,260 1388,260 1388,197" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1226,305 1226,425 492,425 492,431" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="593,476 615,476" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="817,476 839,476" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="910,521 910,584 1063,584" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1265,584 1388,584 1388,521" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="970,521 970,647" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="1041,692 1388,692 1388,755" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="369,800 391,800" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><polyline points="532,755 532,640 716,640 716,521" fill="none" stroke="#14284b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="167" y="107" width="202" height="90" rx="10" fill="#e3e5ff" stroke="#4a4fd4" stroke-width="1.8"/><text x="268" y="148.75" text-anchor="middle" font-size="12.2" fill="#14284b">① Calls the studio number, any</text><text x="268" y="163.25" text-anchor="middle" font-size="12.2" fill="#14284b">hour of the day or night</text><rect x="391" y="107" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="141.5" text-anchor="middle" font-size="12.2" fill="#14284b">② Speaks: name, area, size,</text><text x="492" y="156" text-anchor="middle" font-size="12.2" fill="#14284b">scope, timeline, who decides</text><text x="492" y="170.5" text-anchor="middle" font-size="12.2" fill="#14284b">(English · Hindi · Marathi)</text><rect x="1287" y="107" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="134.25" text-anchor="middle" font-size="12.2" fill="#14284b">⑦ Hears the answer: a booked</text><text x="1388" y="148.75" text-anchor="middle" font-size="12.2" fill="#14284b">consultation with Ruhi or Jay, or</text><text x="1388" y="163.25" text-anchor="middle" font-size="12.2" fill="#14284b">a kind honest decline. Never a</text><text x="1388" y="177.75" text-anchor="middle" font-size="12.2" fill="#14284b">price</text><rect x="615" y="215" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="249.5" text-anchor="middle" font-size="12.2" fill="#14284b">Prompt v3.4: studio facts, 9</text><text x="716" y="264" text-anchor="middle" font-size="12.2" fill="#14284b">questions, call types,</text><text x="716" y="278.5" text-anchor="middle" font-size="12.2" fill="#14284b">guardrails. No prices, no rubric</text><rect x="839" y="215" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="242.25" text-anchor="middle" font-size="12.2" fill="#14284b">③ Says it is an AI and recorded.</text><text x="940" y="256.75" text-anchor="middle" font-size="12.2" fill="#14284b">One question at a time. Tells the</text><text x="940" y="271.25" text-anchor="middle" font-size="12.2" fill="#14284b">call type: lead · client update ·</text><text x="940" y="285.75" text-anchor="middle" font-size="12.2" fill="#14284b">complaint · other</text><rect x="1063" y="215" width="202" height="90" rx="10" fill="#ffdcec" stroke="#df3487" stroke-width="1.8"/><text x="1164" y="249.5" text-anchor="middle" font-size="12.2" fill="#14284b">④ GPT-4o runs the conversation,</text><text x="1164" y="264" text-anchor="middle" font-size="12.2" fill="#14284b">calls the 4 live tools, speaks</text><text x="1164" y="278.5" text-anchor="middle" font-size="12.2" fill="#14284b">returned lines word for word</text><rect x="391" y="323" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="350.25" text-anchor="middle" font-size="12.2" fill="#14284b">⑤ Tool request with what was said</text><text x="492" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">so far: area, size, scope,</text><text x="492" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">timeline, budget only if</text><text x="492" y="393.75" text-anchor="middle" font-size="12.2" fill="#14284b">volunteered</text><rect x="615" y="323" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="350.25" text-anchor="middle" font-size="12.2" fill="#14284b">Editable rubric: 5 criteria,</text><text x="716" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">service area, budget floor</text><text x="716" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">(server only), shared calendar</text><text x="716" y="393.75" text-anchor="middle" font-size="12.2" fill="#14284b">busy times</text><rect x="839" y="323" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="357.5" text-anchor="middle" font-size="12.2" fill="#14284b">⑥ Rule engine: proceed, ask one</text><text x="940" y="372" text-anchor="middle" font-size="12.2" fill="#14284b">question, or decline. Finds open</text><text x="940" y="386.5" text-anchor="middle" font-size="12.2" fill="#14284b">slots. Books with no overlaps</text><rect x="1287" y="323" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="364.75" text-anchor="middle" font-size="12.2" fill="#14284b">Fit decision + the exact line to</text><text x="1388" y="379.25" text-anchor="middle" font-size="12.2" fill="#14284b">say. Slot booked and saved</text><rect x="391" y="431" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="465.5" text-anchor="middle" font-size="12.2" fill="#14284b">⑧ Signed webhook when the call</text><text x="492" y="480" text-anchor="middle" font-size="12.2" fill="#14284b">ends: transcript, times, phone</text><text x="492" y="494.5" text-anchor="middle" font-size="12.2" fill="#14284b">number</text><rect x="615" y="431" width="202" height="90" rx="10" fill="#dff6e5" stroke="#2e9e55" stroke-width="1.8"/><text x="716" y="465.5" text-anchor="middle" font-size="12.2" fill="#14284b">Rubric, office hours, designers,</text><text x="716" y="480" text-anchor="middle" font-size="12.2" fill="#14284b">and past corrections (Teach the</text><text x="716" y="494.5" text-anchor="middle" font-size="12.2" fill="#14284b">AI)</text><rect x="839" y="431" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="458.25" text-anchor="middle" font-size="12.2" fill="#14284b">⑨ Hide numbers → check each quote</text><text x="940" y="472.75" text-anchor="middle" font-size="12.2" fill="#14284b">is real → rules → hot/warm/cold →</text><text x="940" y="487.25" text-anchor="middle" font-size="12.2" fill="#14284b">price-leak scan → assign designer</text><text x="940" y="501.75" text-anchor="middle" font-size="12.2" fill="#14284b">→ write brief</text><rect x="1287" y="431" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="465.5" text-anchor="middle" font-size="12.2" fill="#14284b">Verdict, temperature, brief,</text><text x="1388" y="480" text-anchor="middle" font-size="12.2" fill="#14284b">flags and follow-ups saved to the</text><text x="1388" y="494.5" text-anchor="middle" font-size="12.2" fill="#14284b">database</text><rect x="1063" y="539" width="202" height="90" rx="10" fill="#ffdcec" stroke="#df3487" stroke-width="1.8"/><text x="1164" y="566.25" text-anchor="middle" font-size="12.2" fill="#14284b">⑩ Gemini reads the redacted</text><text x="1164" y="580.75" text-anchor="middle" font-size="12.2" fill="#14284b">transcript and extracts facts,</text><text x="1164" y="595.25" text-anchor="middle" font-size="12.2" fill="#14284b">each with a real quote. It never</text><text x="1164" y="609.75" text-anchor="middle" font-size="12.2" fill="#14284b">decides</text><rect x="839" y="647" width="202" height="90" rx="10" fill="#fff0cd" stroke="#e8991c" stroke-width="1.8"/><text x="940" y="674.25" text-anchor="middle" font-size="12.2" fill="#14284b">⑪ Sends the designer email</text><text x="940" y="688.75" text-anchor="middle" font-size="12.2" fill="#14284b">(Resend), creates the HubSpot</text><text x="940" y="703.25" text-anchor="middle" font-size="12.2" fill="#14284b">deal, adds the calendar event,</text><text x="940" y="717.75" text-anchor="middle" font-size="12.2" fill="#14284b">alerts on complaints</text><rect x="167" y="755" width="202" height="90" rx="10" fill="#e3e5ff" stroke="#4a4fd4" stroke-width="1.8"/><text x="268" y="796.75" text-anchor="middle" font-size="12.2" fill="#14284b">⑫ Gets the email or opens the</text><text x="268" y="811.25" text-anchor="middle" font-size="12.2" fill="#14284b">dashboard</text><rect x="391" y="755" width="202" height="90" rx="10" fill="#dfeeff" stroke="#2f78d1" stroke-width="1.8"/><text x="492" y="789.5" text-anchor="middle" font-size="12.2" fill="#14284b">⑬ Corrects a verdict or fact,</text><text x="492" y="804" text-anchor="middle" font-size="12.2" fill="#14284b">edits the Rubric, marks a</text><text x="492" y="818.5" text-anchor="middle" font-size="12.2" fill="#14284b">callback done</text><rect x="1287" y="755" width="202" height="90" rx="10" fill="#ffe3de" stroke="#e5483a" stroke-width="1.8"/><text x="1388" y="782.25" text-anchor="middle" font-size="12.2" fill="#14284b">Dashboard: calls, brief,</text><text x="1388" y="796.75" text-anchor="middle" font-size="12.2" fill="#14284b">verdicts, metrics, revenue</text><text x="1388" y="811.25" text-anchor="middle" font-size="12.2" fill="#14284b">estimate. Daily digest. Email +</text><text x="1388" y="825.75" text-anchor="middle" font-size="12.2" fill="#14284b">deal + calendar</text><text x="750" y="888" text-anchor="middle" font-size="12.5" fill="#4b5b76">Dashed arrows show the flow. The voice agent never sees prices or the rubric: every decision is made by the rule engine on the server. Humans stay in the loop: nothing is auto-rejected, and every verdict can be overridden.</text></svg>
