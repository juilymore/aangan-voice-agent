# Every 15 minutes: process any webhook that wasn't finished and retry failed email/CRM syncs.
# Vercel's free plan only allows daily cron jobs, so GitHub Actions calls the endpoint instead.
# Needs repository secrets APP_URL (e.g. https://aangan.vercel.app) and CRON_SECRET (same as on Vercel).
name: reconcile
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/reconcile
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reconcile"
